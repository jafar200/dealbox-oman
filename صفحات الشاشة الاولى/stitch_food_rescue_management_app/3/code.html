<span class="font-headline-sm text-headline-sm text-on-surface">4.9</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">مجتمع وفي</span>
</div>
<!-- Floating Pill 2: Freshness / Community Pick Tag -->
<div class="absolute -top-3 left-4 z-20 flex items-center gap-1.5 bg-surface-container-lowest shadow-md px-3 py-1.5 rounded-full animate-pulse" style="animation-duration: 2.8s;">

<div class="w-7 h-7 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label-sm text-label-sm font-bold shrink-0">
        س.م
      </div>
<div class="flex flex-col min-w-0">
<p class="font-label-sm text-label-sm text-on-surface font-semibold truncate">سارة محمد</p>
<p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-1 text-[11px]">مخبوزات طازجة ولذيذة جداً! 😍</p>
</div>
</div>

<defs>
<lineargradient id="boxFront" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#00855d"></stop>
<stop offset="100%" stop-color="#006948"></stop>

<lineargradient id="boxSide" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#006948"></stop>
<stop offset="100%" stop-color="#005137"></stop>
</lineargradient>
<lineargradient id="boxInnerLight" x1="50%" x2="50%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#fff8db" stop-opacity="0.9"></stop>
<stop offset="60%" stop-color="#fea619" stop-opacity="0.4"></stop>
<stop offset="100%" stop-color="#006948" stop-opacity="0"></stop>
</lineargradient>
<radialgradient cx="50%" cy="40%" id="sunbeam" r="50%">
<stop offset="0%" stop-color="#fea619" stop-opacity="0.6"></stop>
<stop offset="100%" stop-color="#fea619" stop-opacity="0"></stop>

</defs>
<!-- Upward Aura Rays -->
<circle cx="120" cy="115" fill="url(#sunbeam)" r="75"></circle>
<!-- Floating Goodies emerging from box -->

<path d="M92 90C92 84 96 78 103 78C110 78 113 83 113 88C113 93 107 94 100 94C95 94 92 92 92 90Z" fill="#fea619"></path>
<circle cx="106" cy="84" fill="#684000" r="1.5"></circle>
<circle cx="98" cy="86" fill="#684000" r="1.2"></circle>
</g>
<!-- Fresh Produce / Organic Leaf Badge -->
<g class="transition-transform duration-700 hover:scale-110 origin-center cursor-pointer">
<circle cx="145" cy="80" fill="#f5fff7" r="20"></circle>
<path d="M140 85C140 76 148 72 153 72C153 77 151 86 142 87" fill="#00855d"></path>
<path d="M140 85C143 82 147 80 150 79" stroke="#85f8c4" stroke-linecap="round" stroke-width="1.5"></path>
</g>
<!-- Sparkles / Magic Delight Particles -->
<path d="M120 48L122 55L129 57L122 59L120 66L118 59L111 57L118 55L120 48Z" fill="#fea619"></path>
<path d="M72 108L73.5 113L78 114.5L73.5 116L72 121L70.5 116L66 114.5L70.5 113L72 108Z" fill="#ffb95f"></path>
<path d="M168 104L169.5 108L174 109.5L169.5 111L168 115L166.5 111L162 109.5L166.5 108L168 104Z" fill="#6ffbbe"></path>
<!-- Isometric Box Base -->
<!-- Interior Glow Plane -->
<polygon fill="url(#boxInnerLight)" points="120,105 175,130 120,155 65,130"></polygon>
<!-- Left Outer Wall -->
<polygon fill="url(#boxFront)" points="65,130 120,155 120,210 65,185"></polygon>
<!-- Right Outer Wall -->
<polygon fill="url(#boxSide)" points="120,155 175,130 175,185 120,210"></polygon>
<!-- Left Open Flap -->
<polygon fill="#00855d" points="65,130 120,105 105,82 50,108"></polygon>
<!-- Right Open Flap -->
<polygon fill="#006948" points="175,130 120,105 135,82 190,108"></polygon>
<!-- Front Left Open Flap -->
<polygon fill="#005137" points="65,130 120,155 108,180 52,152"></polygon>

<path d="M90 142L95 198L105 203L100 147Z" fill="#fea619"></path>

<!-- Active Community Verified Ribbon -->
<div class="flex items-center gap-1.5 mt-2 bg-surface-container px-3 py-1 rounded-full">

<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">أكثر من ١٢,٠٠٠ وجبة تم إنقاذها هذا الأسبوع</span>
</div>
</div>
<!-- Text & Narrative Section -->
<div class="flex flex-col items-center text-center px-space-xs mt-space-sm">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-space-xs">
      استكشف ما داخل الـ Dealbox 👁️✨
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm leading-relaxed">
      استعرض تجارب مجتمع Dealbox، واكتشف ترشيحات الوجبات والصناديق الأكثر طلباً التي تستحق التجربة.
    </p>
</div>
<!-- Bottom Interactive Stepper & Actions -->
<div class="flex flex-col items-center gap-space-lg mt-space-lg w-full">

</div>
<!-- Action Buttons Row -->
<div class="flex items-center justify-between w-full gap-space-md pt-space-xs pb-safe">

</div>
</div>
