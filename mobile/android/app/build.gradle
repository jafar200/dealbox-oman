plugins {
    id 'com.android.application'
}

// إشعارات Firebase (FCM) فعّالة فقط عند وجود ملف google-services.json.
// ضع الملف في هذا المجلد (mobile/android/app/google-services.json) من لوحة Firebase.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    logger.lifecycle('DealBox: google-services.json موجود — تفعيل إشعارات Firebase (FCM).')
} else {
    logger.lifecycle('DealBox: google-services.json غير موجود — تخطّي إشعارات Firebase (التطبيق يعمل عادي).')
}

android {
    namespace 'om.dealbox.app'
    compileSdk 35

    defaultConfig {
        applicationId "om.dealbox.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            // بيانات مفتاح التوقيع تُقرأ من local.properties (غير مرفوعة في git)
            def props = new Properties()
            def propsFile = rootProject.file('local.properties')
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
            }
            storeFile rootProject.file(props.getProperty('RELEASE_STORE_FILE', 'dealbox-release.keystore'))
            storePassword props.getProperty('RELEASE_STORE_PASSWORD', '')
            keyAlias props.getProperty('RELEASE_KEY_ALIAS', 'dealbox')
            keyPassword props.getProperty('RELEASE_KEY_PASSWORD', '')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // توقيع نسخة الإنتاج — يُنتج ملف .aab الجاهز لمتجر Google Play
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    // تسجيل الدخول عبر Google بشكل أصلي (Native) — يعمل داخل WebView
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    // إشعارات Firebase Cloud Messaging (تظهر على شاشة القفل حتى لو التطبيق مغلق).
    // تعمل فقط عند إضافة google-services.json (انظر أعلى الملف).
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}

configurations.all {
    resolutionStrategy {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}
